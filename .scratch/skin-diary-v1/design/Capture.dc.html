<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg: oklch(98% 0.006 85);
      --fg: oklch(22% 0.012 85);
      --fg-muted: oklch(46% 0.012 85);
      --sage: oklch(46% 0.07 145);
      --sage-soft: oklch(93% 0.02 145);
      --clay: oklch(58% 0.09 45);
      --border: oklch(90% 0.008 85);
      --viewfinder: oklch(30% 0.015 260);
      --font-display: 'Newsreader', Georgia, serif;
      --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
    a { color: var(--clay); text-decoration: none; }
  </style>
</helmet>

<div style="display:flex; flex-direction:column; height:100%; background:var(--bg);">

  <!-- Top bar -->
  <div style="display:flex; align-items:center; gap:2px; padding:8px 20px 4px 8px;">
    <div style="width:44px; height:44px; min-width:44px; display:flex; align-items:center; justify-content:center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--fg)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
    </div>
    <div style="font-family:var(--font-display); font-size:19px; font-weight:600;">Chụp ảnh tối nay</div>
  </div>

  <!-- Viewfinder -->
  <div style="margin:8px 20px 0; position:relative; border-radius:20px; overflow:hidden; background:var(--viewfinder); aspect-ratio:3/4;">

    <!-- brightness badge -->
    <div style="position:absolute; top:16px; left:16px; display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,0.92); font-size:12.5px; font-weight:600; color:var(--sage);">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--sage)" stroke-width="2.4" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>
      Đủ sáng
    </div>

    <!-- ghost of previous photo -->
    <svg viewBox="0 0 300 400" style="position:absolute; inset:0; width:100%; height:100%;">
      <ellipse cx="146" cy="196" rx="78" ry="102" fill="none" stroke="white" stroke-width="1" opacity="0.12"></ellipse>
    </svg>

    <!-- live guide oval + landmark dots -->
    <svg viewBox="0 0 300 400" style="position:absolute; inset:0; width:100%; height:100%;">
      <ellipse cx="150" cy="200" rx="82" ry="106" fill="none" stroke="white" stroke-width="1.6" stroke-dasharray="3 6" opacity="0.85"></ellipse>
      <sc-for list="{{landmarks}}" as="pt" hint-placeholder-count="40">
        <circle cx="{{pt.x}}" cy="{{pt.y}}" r="1.3" fill="white" opacity="0.55"></circle>
      </sc-for>
    </svg>

    <div style="position:absolute; bottom:18px; left:0; right:0; text-align:center; font-size:13px; color:rgba(255,255,255,0.85);">Đặt mặt vào khung hình</div>
  </div>

  <div style="text-align:center; font-size:13px; color:var(--fg-muted); padding:14px 32px 0;">Giữ khoảng cách và góc như lần trước</div>

  <!-- shutter -->
  <div style="margin-top:auto; display:flex; flex-direction:column; align-items:center; gap:10px; padding:28px 0 34px;">
    <div style="width:68px; height:68px; border-radius:50%; border:3px solid var(--clay); display:flex; align-items:center; justify-content:center;">
      <div style="width:54px; height:54px; border-radius:50%; background:var(--clay);"></div>
    </div>
    <div style="font-size:12.5px; color:var(--fg-muted);">Chụp</div>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const cx = 150, cy = 200, rx = 82, ry = 106;
    const landmarks = [];
    for (let i = 0; i < 40; i++) {
      const t = (i / 40) * Math.PI * 2;
      landmarks.push({
        x: Math.round((cx + Math.cos(t) * rx) * 100) / 100,
        y: Math.round((cy + Math.sin(t) * ry) * 100) / 100,
      });
    }
    return { landmarks };
  }
}
</script>
</body>
</html>
