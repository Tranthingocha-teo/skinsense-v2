<div style="position:relative; display:flex; flex-direction:column; width:390px; height:844px; overflow:hidden; background:var(--bg); color:var(--fg);">
  <div style="display:flex; align-items:center; gap:4px; padding:16px 18px 0 10px;">
    <span style="display:flex; align-items:center; justify-content:center; width:44px; height:44px;"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></span>
    <h1 style="font-family:var(--display); font-size:34px; font-weight:300; line-height:1.15;">Đánh dấu nốt mụn</h1>
  </div>

  <!-- Saved photo (placeholder). Each marker is a 44px hit target: halo + dot -->
  <div style="position:relative; margin:12px 20px 0; aspect-ratio:3 / 4; border-radius:18px; overflow:hidden; background:radial-gradient(40% 34% at 50% 46%, color-mix(in oklab, var(--photo-c) 38%, transparent), transparent 72%), radial-gradient(90% 70% at 20% 85%, var(--photo-a), transparent 75%), linear-gradient(180deg, var(--photo-b), var(--photo-a));">
    <span style="position:absolute; left:153px; top:98px; display:flex; align-items:center; justify-content:center; width:44px; height:44px;"><span style="position:absolute; width:30px; height:30px; border-radius:999px; background:color-mix(in oklab, var(--accent) 24%, transparent);"></span><span style="position:relative; width:13px; height:13px; border-radius:999px; background:var(--accent); border:1.5px solid var(--bg);"></span></span>
    <span style="position:absolute; left:214px; top:240px; display:flex; align-items:center; justify-content:center; width:44px; height:44px;"><span style="position:absolute; width:30px; height:30px; border-radius:999px; background:color-mix(in oklab, var(--accent) 24%, transparent);"></span><span style="position:relative; width:13px; height:13px; border-radius:999px; background:var(--accent); border:1.5px solid var(--bg);"></span></span>
    <span style="position:absolute; left:158px; top:350px; display:flex; align-items:center; justify-content:center; width:44px; height:44px;"><span style="position:absolute; width:30px; height:30px; border-radius:999px; background:color-mix(in oklab, var(--accent) 24%, transparent);"></span><span style="position:relative; width:13px; height:13px; border-radius:999px; background:var(--accent); border:1.5px solid var(--bg);"></span></span>
    <span style="position:absolute; bottom:14px; left:14px; padding:4px 10px; border:1px dashed color-mix(in oklab, var(--fg) 45%, transparent); border-radius:999px; font-size:11px;">Ảnh · placeholder</span>
  </div>

  <div style="display:flex; align-items:center; justify-content:center; gap:8px; padding:18px 20px 0; font-size:14px; font-weight:300; color:var(--muted);">
    <span style="flex-shrink:0; color:var(--danger);"><!--I:alert:16--></span>Chạm vào da trong các vùng mặt (trán, má, mũi, cằm)
  </div>
  <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:8px; padding:12px 20px 0;">
    <span style="display:flex; align-items:baseline; gap:6px; padding:5px 12px; border-radius:4px; border:1px solid color-mix(in oklab, var(--fg) 14%, transparent); font-size:13px;">Trán <span style="font-family:var(--display); font-size:17px;">1</span></span>
    <span style="display:flex; align-items:baseline; gap:6px; padding:5px 12px; border-radius:4px; border:1px solid color-mix(in oklab, var(--fg) 14%, transparent); font-size:13px;">Má phải <span style="font-family:var(--display); font-size:17px;">1</span></span>
    <span style="display:flex; align-items:baseline; gap:6px; padding:5px 12px; border-radius:4px; border:1px solid color-mix(in oklab, var(--fg) 14%, transparent); font-size:13px;">Cằm <span style="font-family:var(--display); font-size:17px;">1</span></span>
  </div>

  <div style="margin-top:auto; padding:20px 20px 32px;">
    <p role="alert" class="row" style="gap:8px; justify-content:center; padding-bottom:12px; color:var(--danger); font-size:14px;"><!--I:alert:16-->Lưu thất bại. Vui lòng thử lại.</p>
    <div style="display:flex; align-items:center; justify-content:center; height:52px; border-radius:4px; background:var(--accent); color:var(--on-accent); font-size:15px; font-weight:500;">Lưu</div>
  </div>
</div>
