<div style="position:relative; display:flex; flex-direction:column; width:390px; height:844px; overflow:hidden; background:var(--bg); color:var(--fg);">
  <div class="night" style="position:absolute; left:0; right:0; top:0; height:420px;"></div>

  <div class="row" style="position:relative; justify-content:flex-end; padding:16px 8px 0;">
    <a href="#" class="row" style="min-height:44px; padding:0 12px; font-size:14px;">Bỏ qua</a>
  </div>

  <!-- Guide frame, drawn the way Capture shows it -->
  <div class="photo" style="position:relative; align-self:center; width:240px; height:320px; margin-top:24px; border-radius:18px; overflow:hidden;">
    <svg viewBox="0 0 240 320" style="position:absolute; left:0; top:0; width:100%; height:100%;">
      <ellipse cx="120" cy="160" rx="65.5" ry="84.8" fill="none" stroke-width="1.5" stroke-dasharray="3.5 7" stroke-linecap="round" style="stroke:var(--fg); opacity:0.85;"></ellipse>
    </svg>
    <span style="position:absolute; top:12px; left:12px; display:flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; background:color-mix(in oklab, var(--bg) 60%, transparent); font-size:11.5px; font-weight:500;"><span style="width:6px; height:6px; border-radius:999px; background:var(--good);"></span>Đủ sáng</span>

  <div style="position:relative; display:flex; flex-direction:column; gap:22px; margin-top:auto; padding:0 24px 36px;">
    <div class="row" style="gap:6px;"><span style="width:28px; height:2px; background:var(--line);"></span><span style="width:28px; height:2px; background:var(--fg);"></span><span style="width:28px; height:2px; background:var(--line);"></span></div>
    <h1 class="d" style="font-size:40px; line-height:1.15; text-wrap:balance;">Cùng một chỗ, cùng ánh sáng.</h1>

    <div class="btn">Tiếp tục</div>
  </div>
</div>
