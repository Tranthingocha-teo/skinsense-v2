<div style="position:relative; display:flex; flex-direction:column; width:390px; height:844px; overflow:hidden; background:var(--bg); color:var(--fg);">
  <div class="row" style="gap:4px; padding:16px 18px 0 10px;">
    <span class="hit"><!--I:back:23--></span>
    <h1 class="d" style="font-size:34px; line-height:1.15;">Chụp ảnh tối nay</h1>
  </div>

  <div role="alert" style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; margin:12px 20px 0; aspect-ratio:3 / 4; padding:0 32px; border-radius:18px; background:var(--surface); border:1px solid color-mix(in oklab, var(--fg) 10%, transparent); text-align:center;">
    <span style="display:flex; align-items:center; justify-content:center; width:64px; height:64px; border-radius:999px; border:1px solid color-mix(in oklab, var(--fg) 30%, transparent);"><!--I:cameraoff:28--></span>

    <div class="btn" style="align-self:stretch; padding:0 12px;">Cho phép truy cập camera</div>
  </div>

  <div style="display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:auto; padding-bottom:92px; opacity:0.4;">
    <span style="display:flex; align-items:center; justify-content:center; width:68px; height:68px; border-radius:999px; border:1.5px solid color-mix(in oklab, var(--fg) 55%, transparent);"><span style="width:54px; height:54px; border-radius:999px; background:var(--accent);"></span></span>
    <span class="muted" style="font-size:12.5px; font-weight:300;">Chụp</span>
  </div>

  <!--TABS:capture-->
</div>
