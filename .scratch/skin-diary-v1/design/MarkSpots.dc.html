<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg: oklch(98% 0.006 85);
      --fg: oklch(22% 0.012 85);
      --fg-muted: oklch(46% 0.012 85);
      --clay: oklch(58% 0.09 45);
      --clay-soft: oklch(93% 0.03 45);
      --skin1: oklch(84% 0.045 55);
      --skin2: oklch(76% 0.06 45);
      --border: oklch(90% 0.008 85);
      --font-display: 'Newsreader', Georgia, serif;
      --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
    a { color: var(--clay); text-decoration: none; }
  </style>
</helmet>

<div style="display:flex; flex-direction:column; height:100%; background:var(--bg);">

  <div style="display:flex; align-items:center; gap:2px; padding:8px 20px 4px 8px;">
    <div style="width:44px; height:44px; min-width:44px; display:flex; align-items:center; justify-content:center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--fg)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
    </div>
    <div style="font-family:var(--font-display); font-size:19px; font-weight:600;">Đánh dấu nốt mụn</div>
  </div>

  <div style="margin:8px 20px 0; position:relative; border-radius:20px; overflow:hidden; aspect-ratio:3/4; background:radial-gradient(120% 100% at 50% 20%, var(--skin1), var(--skin2));">

    <svg viewBox="0 0 300 400" style="position:absolute; inset:0; width:100%; height:100%;">
      <ellipse cx="150" cy="200" rx="82" ry="106" fill="none" stroke="oklch(40% 0.02 45)" stroke-width="1" opacity="0.18"></ellipse>
      <path d="M150 200 L150 98 M150 200 L68 200 M150 200 L232 200 M150 200 L150 302" stroke="oklch(40% 0.02 45)" stroke-width="1" opacity="0.14"></path>

      <sc-for list="{{spots}}" as="s" hint-placeholder-count="3">
        <circle cx="{{s.x}}" cy="{{s.y}}" r="13" fill="var(--clay)" opacity="0.16"></circle>
        <circle cx="{{s.x}}" cy="{{s.y}}" r="5.5" fill="var(--clay)"></circle>
        <circle cx="{{s.x}}" cy="{{s.y}}" r="5.5" fill="none" stroke="white" stroke-width="1.5"></circle>
      </sc-for>
    </svg>

  </div>

  <div style="display:flex; align-items:center; justify-content:center; gap:8px; padding:16px 0 0; font-size:14px; color:var(--fg-muted);">
    <span style="width:8px; height:8px; border-radius:50%; background:var(--clay); display:inline-block;"></span>
    3 nốt đã đánh dấu — chạm vào ảnh để thêm
  </div>

  <div style="margin-top:auto; padding:20px 20px 30px;">
    <div style="text-align:center; padding:16px; border-radius:14px; background:var(--clay); color:white; font-weight:600; font-size:16px;">Lưu</div>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      spots: [
        { x: 118, y: 132 },
        { x: 176, y: 150 },
        { x: 162, y: 238 },
      ],
    };
  }
}
</script>
</body>
</html>
