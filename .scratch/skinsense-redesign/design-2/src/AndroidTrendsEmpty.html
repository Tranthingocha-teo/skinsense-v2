<div style="position:relative; width:390px; height:920px; overflow:hidden; background:var(--bg); color:var(--fg);">
  <!-- Night tint carried over from Hôm nay, shallower: the photo lives in the compare card here -->
  <div style="position:absolute; left:0; right:0; top:0; height:260px; background:radial-gradient(60% 60% at 75% 10%, color-mix(in oklab, var(--photo-c) 35%, transparent), transparent 70%), linear-gradient(180deg, var(--photo-b), var(--bg));"></div>

  <div style="position:relative; display:flex; flex-direction:column; gap:12px; padding:16px 18px 96px;">

    <div style="display:flex; align-items:center; gap:4px; margin-left:-8px;">
      <span style="display:flex; align-items:center; justify-content:center; width:44px; height:44px;"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></span>
      <h1 style="flex-grow:1; font-family:var(--display); font-size:38px; font-weight:300; line-height:1.15;">Xu hướng</h1>
      <div style="display:flex; border:1px solid color-mix(in oklab, var(--fg) 14%, transparent); border-radius:4px;">
        <span style="display:flex; align-items:center; height:44px; padding:0 12px; background:var(--accent); color:var(--on-accent); font-size:12.5px; font-weight:500;">7 ngày</span>
        <span style="display:flex; align-items:center; height:44px; padding:0 12px; font-size:12.5px; font-weight:400; color:var(--muted);">30 ngày</span>
      </div>
    </div>

    <div style="display:flex; gap:8px; margin-right:-18px; overflow:hidden;">
      <span style="display:flex; align-items:center; flex-shrink:0; height:44px; padding:0 16px; border-radius:4px; background:var(--accent); color:var(--on-accent); font-size:14px; font-weight:500;">Trán</span>
      <span style="display:flex; align-items:center; flex-shrink:0; height:44px; padding:0 16px; border-radius:4px; border:1px solid color-mix(in oklab, var(--fg) 14%, transparent); color:var(--muted); font-size:14px; font-weight:400;">Má trái</span>
      <span style="display:flex; align-items:center; flex-shrink:0; height:44px; padding:0 16px; border-radius:4px; border:1px solid color-mix(in oklab, var(--fg) 14%, transparent); color:var(--muted); font-size:14px; font-weight:400;">Má phải</span>
      <span style="display:flex; align-items:center; flex-shrink:0; height:44px; padding:0 16px; border-radius:4px; border:1px solid color-mix(in oklab, var(--fg) 14%, transparent); color:var(--muted); font-size:14px; font-weight:400;">Mũi</span>
      <span style="display:flex; align-items:center; flex-shrink:0; height:44px; padding:0 16px; border-radius:4px; border:1px solid color-mix(in oklab, var(--fg) 14%, transparent); color:var(--muted); font-size:14px; font-weight:400;">Cằm</span>
    </div>

    <div style="display:flex; flex-direction:column; gap:8px; padding:18px 20px 12px; border-radius:18px; background:color-mix(in oklab, var(--surface) 72%, transparent); border:1px solid color-mix(in oklab, var(--fg) 14%, transparent); backdrop-filter:blur(18px);">
      <div style="display:flex; align-items:baseline; justify-content:space-between;">
        <h2 style="font-size:11px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted);">Chỉ số mẩn đỏ — Trán</h2>
        </div>
      <div class="row muted" style="justify-content:center; height:190px; font-size:14px; font-weight:300;">Chưa có ảnh trong khoảng này</div>
    </div>

    <div style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px;">
      <div style="display:flex; flex-direction:column; padding:14px 18px; border-radius:18px; background:var(--surface); border:1px solid color-mix(in oklab, var(--fg) 10%, transparent);">
        <span style="font-size:11px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted);">Số nốt mụn</span>
        <span style="font-family:var(--display); font-size:44px; font-weight:300; line-height:1.1;">—</span>
        
      </div>
      <div style="display:flex; flex-direction:column; padding:14px 18px; border-radius:18px; background:var(--surface); border:1px solid color-mix(in oklab, var(--fg) 10%, transparent);">
        <span style="font-size:11px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted);">Routine hoàn thành</span>
        <span style="font-family:var(--display); font-size:44px; font-weight:300; line-height:1.1; color:var(--good);">86%</span>
        <div style="height:1px; margin-top:12px; background:var(--line);"><div style="width:86%; height:1px; background:var(--good);"></div></div>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px; padding:18px 20px 20px; border-radius:18px; background:var(--surface); border:1px solid color-mix(in oklab, var(--fg) 10%, transparent);">
      <h2 style="font-size:11px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted);">So sánh trước / sau</h2>
      <div class="row muted" style="justify-content:center; aspect-ratio:16 / 9; border-radius:10px; border:1px dashed var(--line); font-size:14px; font-weight:300;">Cần ít nhất 2 ảnh trong khoảng này</div>
    </div>

    <p style="text-align:center; font-size:11.5px; font-weight:300; color:var(--muted);">Không phải công cụ chẩn đoán y khoa</p>
  </div>
  <!--TABS:trends-->
</div>
