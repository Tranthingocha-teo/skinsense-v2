<div style="position:relative; display:flex; flex-direction:column; width:390px; height:844px; overflow:hidden; background:var(--bg); color:var(--fg);">
  <div class="night" style="position:absolute; left:0; right:0; top:0; height:360px;"></div>

  <div style="position:relative; display:flex; flex-direction:column; gap:22px; margin-top:auto; padding:0 24px 36px;">
    <div class="row" style="gap:6px;"><span style="width:28px; height:2px; background:var(--line);"></span><span style="width:28px; height:2px; background:var(--line);"></span><span style="width:28px; height:2px; background:var(--fg);"></span></div>
    <h1 class="d" style="font-size:40px; line-height:1.15; text-wrap:balance;">Riêng tư, và không chẩn đoán.</h1>
    <p style="font-size:16px; font-weight:300; line-height:1.6; text-wrap:pretty;">Chỉ số mẩn đỏ so sánh từng vùng với chính làn da của bạn trong cùng bức ảnh. SkinSense không thay thế bác sĩ da liễu.</p>

    <div class="card" style="padding:0 12px 0 16px;">
      <div class="row" style="gap:14px; min-height:72px;">
        <span class="hit" style="border-radius:999px; border:1px solid color-mix(in oklab, var(--fg) 20%, transparent);"><!--I:capture:20--></span>
        <div style="display:flex; flex-direction:column; gap:2px; flex-grow:1;"><span style="font-size:15px;">Camera</span><span class="muted" style="font-size:12.5px; font-weight:300;">Để chụp ảnh tối nay</span></div>
        <span class="row" style="gap:6px; color:var(--good); font-size:13px; font-weight:500;"><!--I:check:16-->Đã cho phép</span>
      </div>
      <div class="row line" style="gap:14px; min-height:72px;">
        <span class="hit" style="border-radius:999px; border:1px solid color-mix(in oklab, var(--fg) 20%, transparent);"><!--I:bell:20--></span>
        <div style="display:flex; flex-direction:column; gap:2px; flex-grow:1;"><span style="font-size:15px;">Thông báo</span><span class="muted" style="font-size:12.5px; font-weight:300;">Nhắc routine buổi tối · không bắt buộc</span></div>
        <span class="btn-o" style="height:44px; padding:0 14px; font-size:13.5px;">Cho phép</span>
      </div>
    </div>

    <div class="btn">Bắt đầu</div>
  </div>
</div>
