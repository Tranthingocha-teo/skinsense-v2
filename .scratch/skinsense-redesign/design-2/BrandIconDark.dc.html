<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@300;400&family=Manrope:wght@300;400;500;600&display=swap">
  <style>
    :root { --bg: #0A0C0B; --surface: #1A1F1C; --surface-2: #242A26; --fg: #F2EFE8; --muted: #BDB8AD; --line: #3A403B; --accent: #ECE7DB; --on-accent: #121412; --good: #AFCFA9; --danger: #E8998D; --photo-a: #2F4A3A; --photo-b: #16241C; --photo-c: #C9B98A; --display: 'Noto Serif Display', Georgia, 'Times New Roman', serif; --font: 'Manrope', 'Segoe UI', system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); }
    a { color: var(--fg); text-decoration: underline; text-underline-offset: 4px; }
    a:hover { color: var(--muted); }
    h1, h2, h3, p { margin: 0; }
    .d { font-family: var(--display); font-weight: 300; }
    .lbl { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .muted { color: var(--muted); }
    .card { border-radius: 18px; background: var(--surface); border: 1px solid color-mix(in oklab, var(--fg) 10%, transparent); }
    .glass { border-radius: 18px; background: color-mix(in oklab, var(--surface) 72%, transparent); border: 1px solid color-mix(in oklab, var(--fg) 14%, transparent); backdrop-filter: blur(18px); }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 24px; border-radius: 4px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 500; }
    .btn-o { display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 24px; border-radius: 4px; border: 1px solid color-mix(in oklab, var(--fg) 55%, transparent); font-size: 15px; font-weight: 400; }
    .chip { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 4px; border: 1px solid color-mix(in oklab, var(--fg) 14%, transparent); font-size: 14px; color: var(--muted); }
    .chip-on { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 4px; background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 500; }
    .ph { padding: 4px 10px; border: 1px dashed color-mix(in oklab, var(--fg) 45%, transparent); border-radius: 999px; font-size: 11px; }
    .photo { background: radial-gradient(40% 34% at 50% 46%, color-mix(in oklab, var(--photo-c) 38%, transparent), transparent 72%), radial-gradient(90% 70% at 20% 85%, var(--photo-a), transparent 75%), linear-gradient(180deg, var(--photo-b), var(--photo-a)); }
    .night { background: radial-gradient(60% 60% at 75% 10%, color-mix(in oklab, var(--photo-c) 32%, transparent), transparent 70%), linear-gradient(180deg, var(--photo-b), var(--bg)); }
    .row { display: flex; align-items: center; }
    .hit { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; }
    .line { border-top: 1px solid var(--line); }
    .cal { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 44px; font-size: 14px; }
    .cal-on { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 44px; height: 44px; margin: 0 auto; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 500; }
    .dot { width: 4px; height: 4px; border-radius: 999px; background: currentColor; }
    .tile { position: relative; aspect-ratio: 3 / 4; border-radius: 6px; overflow: hidden; }
    @keyframes fade-in-down { from { opacity: 0; transform: translateY(-12px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes grow-x { from { transform: scaleX(0); } }
    @keyframes draw { from { stroke-dashoffset: 113.1; } }
    .in { animation: fade-in-down 460ms ease-out both; }
    .grow { transform-origin: left; animation: grow-x 360ms ease-out both; }
    .draw { stroke-dasharray: 113.1; animation: draw 1.4s cubic-bezier(0.65, 0, 0.35, 1) both; }
    .draw-dot { animation: fade 0.4s ease-out 1.2s both; }
    @media (prefers-reduced-motion: reduce) { .in { animation-name: fade; } .grow, .draw { animation: none; } }
    .tile-meta { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between; padding: 16px 7px 6px; background: linear-gradient(180deg, transparent, color-mix(in oklab, var(--bg) 82%, transparent)); font-size: 11px; font-weight: 500; }
  </style>
</helmet>
<div style="position:relative; display:flex; flex-direction:column; gap:40px; width:1440px; height:900px; overflow:hidden; padding:64px 80px; background:var(--bg); color:var(--fg);">
  <div style="display:flex; flex-direction:column; gap:10px;">
    <span class="lbl">Brand assets · từ logo mark</span>
    <h1 class="d" style="font-size:44px; line-height:1.2;">Icon app và favicon</h1>
  </div>

  <div style="display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:40px; align-items:end;">
    <figure style="display:flex; flex-direction:column; gap:16px; margin:0;">
      <div class="row" style="justify-content:center; width:280px; height:280px; border-radius:64px; background:var(--surface); border:1px solid color-mix(in oklab, var(--fg) 10%, transparent);">
        <svg width="190" height="190" viewBox="0 0 64 64" fill="none"><circle cx="28" cy="32" r="18" style="stroke:var(--fg); stroke-width:2.6;"></circle><circle cx="36" cy="32" r="18" style="stroke:var(--fg); stroke-opacity:0.45; stroke-width:2.6;"></circle><circle cx="32" cy="14.45" r="2.6" style="fill:var(--fg);"></circle></svg>
      </div>
      <figcaption style="display:flex; flex-direction:column; gap:2px;"><span style="font-size:15px; font-weight:500;">Icon đầy đủ</span><span class="muted" style="font-size:13px; font-weight:300;">1024×1024 PNG · web manifest 512/192</span></figcaption>
    </figure>

    <figure style="display:flex; flex-direction:column; gap:16px; margin:0;">
      <div style="position:relative; width:280px; height:280px; background:repeating-conic-gradient(color-mix(in oklab, var(--fg) 6%, transparent) 0% 25%, transparent 0% 50%) 0 0 / 24px 24px; border:1px dashed var(--line);">
        <span style="position:absolute; left:47px; top:47px; width:186px; height:186px; border-radius:999px; border:1px dashed color-mix(in oklab, var(--fg) 45%, transparent);"></span>
        <svg width="150" height="150" viewBox="0 0 64 64" fill="none" style="position:absolute; left:65px; top:65px;"><circle cx="28" cy="32" r="18" style="stroke:var(--fg); stroke-width:2.6;"></circle><circle cx="36" cy="32" r="18" style="stroke:var(--fg); stroke-opacity:0.45; stroke-width:2.6;"></circle><circle cx="32" cy="14.45" r="2.6" style="fill:var(--fg);"></circle></svg>
      </div>
      <figcaption style="display:flex; flex-direction:column; gap:2px;"><span style="font-size:15px; font-weight:500;">Adaptive · foreground</span><span class="muted" style="font-size:13px; font-weight:300;">432×432, mark nằm trong vùng an toàn 264 (vòng nét đứt), nét 2.6 để còn rõ ở 48dp</span></figcaption>
    </figure>

    <figure style="display:flex; flex-direction:column; gap:16px; margin:0;">
      <div class="row" style="justify-content:center; width:200px; height:200px; border-radius:999px; background:var(--surface-2);">
        <svg width="120" height="120" viewBox="0 0 64 64" fill="none"><circle cx="28" cy="32" r="18" style="stroke:var(--fg); stroke-width:2.4;"></circle><circle cx="36" cy="32" r="18" style="stroke:var(--fg); stroke-width:2.4;"></circle><circle cx="32" cy="14.45" r="2.8" style="fill:var(--fg);"></circle></svg>
      </div>
      <figcaption style="display:flex; flex-direction:column; gap:2px;"><span style="font-size:15px; font-weight:500;">Monochrome</span><span class="muted" style="font-size:13px; font-weight:300;">Android 13+ themed icon: một màu, không độ mờ</span></figcaption>
    </figure>

    <figure style="display:flex; flex-direction:column; gap:16px; margin:0;">
      <div class="row" style="align-items:flex-end; gap:28px; height:200px;">
        <span class="row" style="justify-content:center; width:48px; height:48px; border-radius:10px; background:var(--surface);"><svg width="40" height="40" viewBox="0 0 64 64" fill="none"><circle cx="28" cy="32" r="18" style="stroke:var(--fg); stroke-width:4;"></circle><circle cx="36" cy="32" r="18" style="stroke:var(--fg); stroke-opacity:0.5; stroke-width:4;"></circle></svg></span>
        <span class="row" style="justify-content:center; width:32px; height:32px; border-radius:6px; background:var(--surface);"><svg width="28" height="28" viewBox="0 0 64 64" fill="none"><circle cx="28" cy="32" r="18" style="stroke:var(--fg); stroke-width:5;"></circle><circle cx="36" cy="32" r="18" style="stroke:var(--fg); stroke-opacity:0.5; stroke-width:5;"></circle></svg></span>
        <span class="row" style="justify-content:center; width:16px; height:16px; border-radius:3px; background:var(--surface);"><svg width="14" height="14" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="22" style="stroke:var(--fg); stroke-width:9;"></circle></svg></span>
      </div>
      <figcaption style="display:flex; flex-direction:column; gap:2px;"><span style="font-size:15px; font-weight:500;">Favicon</span><span class="muted" style="font-size:13px; font-weight:300;">icon.svg + 48/32/16. Ở 16px bỏ vòng thứ hai và chấm, nét dày hơn</span></figcaption>
    </figure>
  </div>
</div>

</x-dc>
</body>
</html>
