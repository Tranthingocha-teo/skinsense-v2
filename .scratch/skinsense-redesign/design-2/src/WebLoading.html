<div style="display:flex; width:1440px; height:900px; overflow:hidden; background:var(--bg); color:var(--fg);">
  <!--NAV:today-->
  <div style="position:relative; flex-grow:1; min-width:0;">
    <div class="night" style="position:absolute; left:0; right:0; top:0; height:380px;"></div>

    <div role="status" style="position:relative; display:flex; flex-direction:column; gap:16px; padding:64px 64px 56px;">
      <div style="display:flex; flex-direction:column; gap:2px; padding-bottom:24px;">
        <span style="font-size:11.5px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase;">Thứ Hai, 14 tháng 9</span>
        <h1 class="d" style="font-size:54px; line-height:60px;">Hôm nay</h1>
        <span class="muted" style="padding-top:6px; font-size:13px; font-weight:300;">Đang tải…</span>
      </div>
      <!-- Skeleton blocks keep the real card sizes so nothing jumps when data lands -->
      <div style="display:grid; grid-template-columns:repeat(12, minmax(0, 1fr)); gap:16px;">
        <div style="grid-column:span 7; height:176px; border-radius:18px; background:color-mix(in oklab, var(--fg) 7%, transparent);"></div>
        <div style="grid-column:span 5; display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px;">
          <div style="height:176px; border-radius:18px; background:color-mix(in oklab, var(--fg) 7%, transparent);"></div>
          <div style="height:176px; border-radius:18px; background:color-mix(in oklab, var(--fg) 7%, transparent);"></div>
        </div>
        <div style="grid-column:span 5; height:300px; border-radius:18px; background:color-mix(in oklab, var(--fg) 5%, transparent);"></div>
        <div style="grid-column:span 7; height:300px; border-radius:18px; background:color-mix(in oklab, var(--fg) 5%, transparent);"></div>
      </div>
    </div>
  </div>
</div>
