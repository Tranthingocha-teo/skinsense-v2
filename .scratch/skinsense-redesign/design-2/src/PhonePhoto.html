<div style="position:relative; display:flex; flex-direction:column; width:390px; height:844px; overflow:hidden; background:var(--bg); color:var(--fg);">
  <div class="row" style="gap:4px; padding:16px 8px 0 10px;">
    <span class="hit"><!--I:back:23--></span>
    <h1 class="d" style="flex-grow:1; font-size:30px; line-height:1.15;">13 thg 9, 22:14</h1>
    <span class="hit"><!--I:share:21--></span>
  </div>

  <div class="photo" style="position:relative; height:320px; margin:12px 20px 0; border-radius:18px; overflow:hidden;">
    <span class="ph" style="position:absolute; left:14px; bottom:14px;">Ảnh · placeholder</span>
    <span style="position:absolute; top:12px; right:12px; padding:4px 10px; border-radius:999px; background:color-mix(in oklab, var(--bg) 60%, transparent); font-size:12px; font-weight:500;">3 nốt</span>
  </div>

  <div class="card" style="display:flex; flex-direction:column; gap:10px; margin:14px 20px 0; padding:16px 18px;">
    <span class="lbl">Ghi chú</span>
    <p style="min-height:52px; font-size:15px; font-weight:300; line-height:1.55;">Ngủ muộn, da hơi khô sau khi rửa mặt.</p>
  </div>

  <div style="display:flex; flex-direction:column; gap:10px; margin:16px 20px 0;">
    <span class="lbl">Tag</span>
    <div class="row" style="flex-wrap:wrap; gap:8px;">
      <span class="chip" style="padding:0 6px 0 14px; color:var(--fg);">Thiếu ngủ <span class="hit" style="margin-right:-6px;"><!--I:close:15--></span></span>
      <span class="chip" style="padding:0 6px 0 14px; color:var(--fg);">Serum mới <span class="hit" style="margin-right:-6px;"><!--I:close:15--></span></span>
      <span class="chip" style="border-style:dashed;"><!--I:plus:15-->Thêm tag</span>
    </div>
  </div>

  <div class="row" style="justify-content:space-between; gap:12px; margin:auto 20px 28px;">
    <span class="btn-o" style="flex-grow:1;">Đánh dấu nốt mụn</span>
    <span class="row" style="min-height:44px; padding:0 8px; color:var(--danger); font-size:15px;">Xóa ảnh</span>
  </div>
</div>
