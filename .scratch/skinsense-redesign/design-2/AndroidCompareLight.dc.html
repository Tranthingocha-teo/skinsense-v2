<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@300;400&family=Manrope:wght@300;400;500;600&display=swap">
  <style>
    :root { --bg: #E8E5DE; --surface: #F6F4EF; --surface-2: #DEDAD1; --fg: #191B19; --muted: #52564E; --line: #C9C5BB; --accent: #1C1F1C; --on-accent: #F2EFE8; --good: #3A6537; --danger: #A33B2E; --photo-a: #B9C7B8; --photo-b: #DCE1D6; --photo-c: #F3E6C4; --display: 'Noto Serif Display', Georgia, 'Times New Roman', serif; --font: 'Manrope', 'Segoe UI', system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); }
    a { color: var(--fg); text-decoration: underline; text-underline-offset: 4px; }
    a:hover { color: var(--muted); }
    h1, h2, h3, p { margin: 0; }
    .d { font-family: var(--display); font-weight: 300; }
    .lbl { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .muted { color: var(--muted); }
    .card { border-radius: 18px; background: var(--surface); border: 1px solid color-mix(in oklab, var(--fg) 10%, transparent); }
    .glass { border-radius: 18px; background: color-mix(in oklab, var(--surface) 72%, transparent); border: 1px solid color-mix(in oklab, var(--fg) 14%, transparent); backdrop-filter: blur(18px); }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 24px; border-radius: 4px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 500; }
    .btn-o { display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 24px; border-radius: 4px; border: 1px solid color-mix(in oklab, var(--fg) 55%, transparent); font-size: 15px; font-weight: 400; }
    .chip { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 4px; border: 1px solid color-mix(in oklab, var(--fg) 14%, transparent); font-size: 14px; color: var(--muted); }
    .chip-on { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 4px; background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 500; }
    .ph { padding: 4px 10px; border: 1px dashed color-mix(in oklab, var(--fg) 45%, transparent); border-radius: 999px; font-size: 11px; }
    .photo { background: radial-gradient(40% 34% at 50% 46%, color-mix(in oklab, var(--photo-c) 38%, transparent), transparent 72%), radial-gradient(90% 70% at 20% 85%, var(--photo-a), transparent 75%), linear-gradient(180deg, var(--photo-b), var(--photo-a)); }
    .night { background: radial-gradient(60% 60% at 75% 10%, color-mix(in oklab, var(--photo-c) 32%, transparent), transparent 70%), linear-gradient(180deg, var(--photo-b), var(--bg)); }
    .row { display: flex; align-items: center; }
    .hit { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; }
    .line { border-top: 1px solid var(--line); }
    .cal { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 44px; font-size: 14px; }
    .cal-on { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 44px; height: 44px; margin: 0 auto; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 500; }
    .dot { width: 4px; height: 4px; border-radius: 999px; background: currentColor; }
    .tile { position: relative; aspect-ratio: 3 / 4; border-radius: 6px; overflow: hidden; }
    @keyframes fade-in-down { from { opacity: 0; transform: translateY(-12px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes grow-x { from { transform: scaleX(0); } }
    @keyframes draw { from { stroke-dashoffset: 113.1; } }
    .in { animation: fade-in-down 460ms ease-out both; }
    .grow { transform-origin: left; animation: grow-x 360ms ease-out both; }
    .draw { stroke-dasharray: 113.1; animation: draw 1.4s cubic-bezier(0.65, 0, 0.35, 1) both; }
    .draw-dot { animation: fade 0.4s ease-out 1.2s both; }
    @media (prefers-reduced-motion: reduce) { .in { animation-name: fade; } .grow, .draw { animation: none; } }
    .tile-meta { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between; padding: 16px 7px 6px; background: linear-gradient(180deg, transparent, color-mix(in oklab, var(--bg) 82%, transparent)); font-size: 11px; font-weight: 500; }
  </style>
</helmet>
<div style="position:relative; width:390px; height:844px; overflow:hidden; background:var(--bg); color:var(--fg);">
  <!-- Trends behind the sheet -->
  <div class="night" style="position:absolute; left:0; right:0; top:0; height:260px;"></div>
  <div style="position:relative; display:flex; flex-direction:column; gap:12px; padding:16px 18px 0;">
    <div class="row" style="gap:4px; margin-left:-8px;"><span class="hit"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></span><h1 class="d" style="font-size:38px; line-height:1.15;">Xu hướng</h1></div>
    <div class="card" style="display:flex; flex-direction:column; gap:12px; padding:18px 20px 20px;">
      <span class="lbl">So sánh trước / sau</span>
      <div class="photo" style="height:170px; border-radius:10px;"></div>
    </div>
  </div>

  <div style="position:absolute; left:0; right:0; top:0; bottom:0; background:color-mix(in oklab, var(--bg) 60%, transparent);"></div>

  <!-- Bottom sheet -->
  <div role="dialog" style="position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; gap:14px; padding:10px 20px 28px; border-radius:18px 18px 0 0; background:var(--surface); border-top:1px solid color-mix(in oklab, var(--fg) 14%, transparent);">
    <span style="align-self:center; width:40px; height:4px; border-radius:999px; background:var(--line);"></span>
    <div style="display:flex; flex-direction:column; gap:4px;">
      <h2 style="font-family:var(--display); font-size:26px; font-weight:400;">Chọn 2 ngày</h2>
      <span class="muted" style="font-size:13px; font-weight:300;">Ngày có chấm là ngày có ảnh</span>
    </div>
    <div style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px;">
      <div style="display:flex; flex-direction:column; justify-content:center; height:56px; padding:0 14px; border-radius:4px; border:1px solid var(--fg);"><span class="lbl">Trước</span><span style="font-size:15px; font-weight:500;">7 thg 9</span></div>
      <div style="display:flex; flex-direction:column; justify-content:center; height:56px; padding:0 14px; border-radius:4px; border:1px solid color-mix(in oklab, var(--fg) 14%, transparent);"><span class="lbl">Sau</span><span style="font-size:15px; font-weight:500;">13 thg 9</span></div>
    </div>
    <div class="row" style="justify-content:space-between;">
      <span class="hit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></span>
      <span style="font-size:15px; font-weight:500;">Tháng 9, 2026</span>
      <span class="hit muted"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></span>
    </div>
    <div style="display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); row-gap:2px; text-align:center;">
      <span class="lbl" style="padding-bottom:6px;">T2</span><span class="lbl">T3</span><span class="lbl">T4</span><span class="lbl">T5</span><span class="lbl">T6</span><span class="lbl">T7</span><span class="lbl">CN</span>
      <span></span><span class="cal">1<span class="dot"></span></span><span class="cal">2<span class="dot"></span></span><span class="cal">3<span class="dot"></span></span><span class="cal">4<span class="dot"></span></span><span class="cal">5<span class="dot"></span></span><span class="cal">6</span>
      <span class="cal-on">7<span class="dot"></span></span><span class="cal">8<span class="dot"></span></span><span class="cal">9<span class="dot"></span></span><span class="cal">10<span class="dot"></span></span><span class="cal">11<span class="dot"></span></span><span class="cal">12<span class="dot"></span></span><span class="cal-on">13<span class="dot"></span></span>
      <span class="cal" style="font-weight:600;">14</span><span class="cal muted">15</span><span class="cal muted">16</span><span class="cal muted">17</span><span class="cal muted">18</span><span class="cal muted">19</span><span class="cal muted">20</span>
      <span class="cal muted">21</span><span class="cal muted">22</span><span class="cal muted">23</span><span class="cal muted">24</span><span class="cal muted">25</span><span class="cal muted">26</span><span class="cal muted">27</span>
      <span class="cal muted">28</span><span class="cal muted">29</span><span class="cal muted">30</span><span></span><span></span><span></span><span></span>
    </div>
    <div class="btn">So sánh</div>
  </div>
</div>

</x-dc>
</body>
</html>
