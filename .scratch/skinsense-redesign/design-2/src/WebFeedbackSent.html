<div style="position:relative; display:flex; width:1440px; height:900px; overflow:hidden; background:var(--bg); color:var(--fg);">
  <!--NAV:settings-->
  <div style="position:relative; flex-grow:1; min-width:0;">
    <div class="night" style="position:absolute; left:0; right:0; top:0; height:300px;"></div>

    <div style="position:relative; display:flex; flex-direction:column; gap:24px; padding:64px 64px 56px;">
      <h1 class="d" style="font-size:54px; line-height:60px;">Cài đặt</h1>

      <div style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px; align-items:start;">
        <div style="display:flex; flex-direction:column; gap:10px;">
          <div class="card row" style="gap:16px; padding:18px 22px;">
            <span class="hit photo" style="border-radius:999px;"></span>
            <div style="display:flex; flex-direction:column; gap:2px;">
              <span style="font-size:15.5px; font-weight:500;">[Tên tài khoản Google]</span>
              <span class="muted" style="font-size:13px; font-weight:300;">[email@gmail.com]</span>
            </div>
          </div>

          <span class="lbl" style="padding:12px 4px 0;">Hiển thị</span>
          <div class="card row" style="justify-content:space-between; gap:12px; padding:8px 8px 8px 22px; font-size:15px;">
            Ngôn ngữ
            <div class="row" style="border:1px solid color-mix(in oklab, var(--fg) 14%, transparent); border-radius:4px;">
              <span class="row" style="height:44px; padding:0 16px; background:var(--accent); color:var(--on-accent); font-size:13px; font-weight:500;">Tiếng Việt</span>
              <span class="row muted" style="height:44px; padding:0 16px; font-size:13px;">English</span>
            </div>
          </div>

          <span class="lbl" style="padding:12px 4px 0;">Dữ liệu</span>
          <div class="card" style="padding:0 14px 0 22px; font-size:15px;">
            <div class="row" style="justify-content:space-between; min-height:56px;">Lịch sử ảnh <span class="hit muted"><!--I:chevron:20--></span></div>
            <div class="row line" style="justify-content:space-between; min-height:56px;">Xuất dữ liệu <span class="hit muted"><!--I:chevron:20--></span></div>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px;">
          <span class="lbl" style="padding:0 4px;">Hỗ trợ</span>
          <div class="card" style="padding:0 14px 0 22px; font-size:15px;">
            <div class="row" style="justify-content:space-between; min-height:56px;">Góp ý <span class="hit muted"><!--I:chevron:20--></span></div>
            <div class="row line" style="justify-content:space-between; min-height:56px;">Chính sách riêng tư <span class="hit muted"><!--I:external:18--></span></div>
          </div>

          <div class="card" style="margin-top:22px; padding:0 22px; font-size:15px;">
            <div class="row" style="min-height:56px;">Đăng xuất</div>
            <div class="row line" style="min-height:56px; color:var(--danger);">Xóa tài khoản</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div role="status" class="row" style="position:absolute; right:32px; bottom:32px; gap:10px; padding:14px 18px; border-radius:4px; background:var(--surface-2); border:1px solid color-mix(in oklab, var(--fg) 14%, transparent); box-shadow:0 16px 40px rgba(0, 0, 0, 0.28); font-size:14px;"><span style="color:var(--good);"><!--I:check:18--></span>Đã gửi góp ý. Cảm ơn bạn!</div>
</div>
