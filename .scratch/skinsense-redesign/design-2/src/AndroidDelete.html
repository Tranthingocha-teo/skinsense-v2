<div style="position:relative; width:390px; height:844px; overflow:hidden; background:var(--bg); color:var(--fg);">
  <!-- Settings scrolled to the bottom, behind the dialog -->
  <div style="display:flex; flex-direction:column; gap:10px; padding:300px 18px 96px;">
    <span class="lbl" style="padding:10px 4px 0;">Hỗ trợ</span>
    <div class="card" style="padding:0 12px 0 18px; font-size:15px;">
      <div class="row" style="justify-content:space-between; min-height:56px;">Góp ý <span class="hit muted"><!--I:chevron:20--></span></div>
      <div class="row line" style="justify-content:space-between; min-height:56px;">Giới thiệu &amp; giấy phép <span class="hit muted"><!--I:chevron:20--></span></div>
      <div class="row line" style="justify-content:space-between; min-height:56px;">Chính sách riêng tư <span class="hit muted"><!--I:external:18--></span></div>
    </div>
    <div class="card" style="margin-top:10px; padding:0 18px; font-size:15px;">
      <div class="row" style="min-height:56px;">Đăng xuất</div>
      <div class="row line" style="min-height:56px; color:var(--danger);">Xóa tài khoản</div>
    </div>
  </div>
  <!--TABS:settings-->

  <div style="position:absolute; left:0; right:0; top:0; bottom:0; background:color-mix(in oklab, var(--bg) 72%, transparent); backdrop-filter:blur(3px);"></div>

  <div role="alertdialog" class="card" style="position:absolute; left:20px; right:20px; top:250px; display:flex; flex-direction:column; gap:14px; padding:24px; background:var(--surface-2); box-shadow:0 24px 60px rgba(0, 0, 0, 0.32);">
    <span style="color:var(--danger);"><!--I:alert:26--></span>
    <h2 style="font-family:var(--display); font-size:28px; font-weight:400; line-height:1.2;">Xóa tài khoản?</h2>
    <p style="font-size:15px; font-weight:300; line-height:1.55; text-wrap:pretty;">Xóa vĩnh viễn toàn bộ ảnh, nốt mụn, chỉ số và routine của bạn. Không thể khôi phục.</p>
    <div class="row" style="gap:10px; padding-top:8px;">
      <div class="btn-o" style="flex-grow:1; padding:0 12px;">Hủy</div>
      <div class="btn" style="flex-grow:1; padding:0 12px; background:var(--danger); color:var(--on-accent);">Xóa tài khoản</div>
    </div>
  </div>
</div>
