<div style="position:relative; display:flex; flex-direction:column; width:390px; height:844px; overflow:hidden; background:var(--bg); color:var(--fg);">
  <div class="row" style="gap:4px; padding:16px 18px 0 10px;">
    <span class="hit"><!--I:back:23--></span>
    <h1 class="d" style="font-size:34px; line-height:1.15;">Góp ý</h1>
  </div>

  <div style="display:flex; flex-direction:column; gap:14px; padding:16px 20px 0;">
    <div style="display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); border:1px solid color-mix(in oklab, var(--fg) 14%, transparent); border-radius:4px;">
      <span class="row" style="justify-content:center; height:44px; background:var(--accent); color:var(--on-accent); font-size:14px; font-weight:500;">Báo lỗi</span>
      <span class="row muted" style="justify-content:center; height:44px; font-size:14px;">Ý tưởng</span>
      <span class="row muted" style="justify-content:center; height:44px; font-size:14px;">Khác</span>
    </div>

    <span class="lbl" style="padding:8px 4px 0;">Nội dung</span>
    <div class="card" style="min-height:200px; padding:16px 18px; border-color:color-mix(in oklab, var(--fg) 30%, transparent);">
      <span class="muted" style="font-size:15px; font-weight:300; line-height:1.55;">Điều gì chưa ổn, hoặc bạn muốn SkinSense làm thêm gì?</span>
    </div>

    <div class="row" style="gap:14px; min-height:48px; padding:0 4px; font-size:14.5px; font-weight:300;"><!--TICK-->Đính kèm phiên bản ứng dụng và loại máy</div>
    <p class="muted" style="padding:0 4px; font-size:12.5px; font-weight:300; line-height:1.5;">Không gửi kèm ảnh hay số liệu da của bạn.</p>
  </div>

  <p role="alert" class="row" style="gap:8px; justify-content:center; margin:auto 20px 12px; color:var(--danger); font-size:14px;"><!--I:alert:16-->Gửi thất bại. Vui lòng thử lại.</p>
  <div class="btn" style="margin:0 20px 28px;">Gửi góp ý</div>
</div>
