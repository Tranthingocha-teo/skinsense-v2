# Cài đặt → Góp ý → send → confirmation (ticket 20). Writes one feedback row to
# production Supabase: run only after Dinh approves. Preconditions: signed-in
# session, dev build, device locale en. Not executed yet.
appId: com.dinh144.skinsense
---
- launchApp
- tapOn: "Settings"
- tapOn: "Feedback"
- tapOn: "Idea"
- tapOn: "Message"
- inputText: "maestro feedback"
- hideKeyboard
- tapOn: "Attach app version and phone model"
- tapOn: "Send feedback"
- extendedWaitUntil:
    visible: "Feedback sent"
    timeout: 15000
- tapOn: "Done"
- assertVisible: "Privacy policy"
