<div style="position:relative; width:390px; height:844px; overflow:hidden; background:var(--bg); color:var(--fg);">
  <div class="night" style="position:absolute; left:0; right:0; top:0; height:240px;"></div>

  <div style="position:relative; display:flex; flex-direction:column; gap:10px; padding:64px 18px 96px;">
    <h1 class="d" style="padding:0 4px 14px; font-size:54px; line-height:60px;">Cài đặt</h1>

    <div class="card row" style="gap:14px; padding:14px 18px;">
      <span class="hit photo" style="border-radius:999px;"></span>
      <div style="display:flex; flex-direction:column; gap:2px; min-width:0;">
        <span style="font-size:15.5px; font-weight:500;">[Tên tài khoản Google]</span>
        <span class="muted" style="font-size:13px; font-weight:300;">[email@gmail.com]</span>
      </div>
    </div>

    <span class="lbl" style="padding:10px 4px 0;">Hiển thị</span>
    <div class="card row" style="justify-content:space-between; gap:12px; padding:6px 6px 6px 18px; font-size:15px;">
      Ngôn ngữ
      <div class="row" style="border:1px solid color-mix(in oklab, var(--fg) 14%, transparent); border-radius:4px;">
        <span class="row" style="height:44px; padding:0 14px; background:var(--accent); color:var(--on-accent); font-size:13px; font-weight:500;">Tiếng Việt</span>
        <span class="row muted" style="height:44px; padding:0 14px; font-size:13px;">English</span>
      </div>
    </div>

    <span class="lbl" style="padding:10px 4px 0;">Nhắc nhở &amp; bảo mật</span>
    <div class="card" style="padding:0 12px 0 18px;">
      <div class="row" style="justify-content:space-between; gap:12px; min-height:60px;">
        <div style="display:flex; flex-direction:column; gap:2px;"><span style="font-size:15px;">Nhắc routine buổi tối</span><span class="muted" style="font-size:12.5px; font-weight:300;">21:30 mỗi tối</span></div>
        <span class="hit muted"><!--I:chevron:20--></span>
      </div>
      <div class="row line" style="justify-content:space-between; gap:12px; min-height:60px; font-size:15px;">Khóa bằng vân tay <!--TOG:off--></div>
    </div>

    <span class="lbl" style="padding:10px 4px 0;">Dữ liệu</span>
    <div class="card" style="padding:0 12px 0 18px; font-size:15px;">
      <div class="row" style="justify-content:space-between; min-height:56px;">Lịch sử ảnh <span class="hit muted"><!--I:chevron:20--></span></div>
      <div class="row line" style="justify-content:space-between; min-height:56px;">Xuất dữ liệu <span class="hit muted"><!--I:chevron:20--></span></div>
    </div>

    <span class="lbl" style="padding:10px 4px 0;">Hỗ trợ</span>
    <div class="card" style="padding:0 12px 0 18px; font-size:15px;">
      <div class="row" style="justify-content:space-between; min-height:56px;">Góp ý <span class="hit muted"><!--I:chevron:20--></span></div>
      <div class="row line" style="justify-content:space-between; min-height:56px;">Giới thiệu &amp; giấy phép <span class="hit muted"><!--I:chevron:20--></span></div>
      <div class="row line" style="justify-content:space-between; min-height:56px;">Chính sách riêng tư <span class="hit muted"><!--I:external:18--></span></div>
    </div>

    <div class="card" style="margin-top:10px; padding:0 18px; font-size:15px;">
      <div class="row" style="min-height:56px;">Đăng xuất</div>
      <div class="row line" style="min-height:56px; color:var(--danger);">Xóa tài khoản</div>
    </div>
  </div>

  <!--TABS:settings-->
</div>
