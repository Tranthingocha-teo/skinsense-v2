<div style="display:flex; width:1440px; height:900px; overflow:hidden; background:var(--bg); color:var(--fg);">
  <!--NAV:capture-->
  <div style="display:flex; flex-direction:column; gap:32px; flex-grow:1; min-width:0; padding:64px 64px 56px;">
    <h1 style="font-family:var(--display); font-size:54px; font-weight:300; line-height:60px;">Chụp ảnh tối nay</h1>

    <div style="display:flex; align-items:center; gap:56px;">
      <!-- Viewfinder: gradient stands in for the live webcam; the 468-point mesh dots draw over it -->
      <div style="position:relative; flex-shrink:0; width:720px; height:540px; border-radius:18px; overflow:hidden; background:radial-gradient(22% 38% at 50% 46%, color-mix(in oklab, var(--photo-c) 38%, transparent), transparent 72%), radial-gradient(70% 70% at 15% 90%, var(--photo-a), transparent 75%), linear-gradient(180deg, var(--photo-b), var(--photo-a));">
        <svg viewBox="0 0 720 540" style="position:absolute; left:0; top:0; width:100%; height:100%;">
          <ellipse cx="360" cy="262" rx="124" ry="176" fill="none" stroke-width="1.5" stroke-dasharray="3.5 7" stroke-linecap="round" style="stroke:var(--fg); opacity:0.85;"></ellipse>
        </svg>
        <span style="position:absolute; top:18px; left:18px; display:flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; background:color-mix(in oklab, var(--bg) 60%, transparent); border:1px solid color-mix(in oklab, var(--fg) 14%, transparent); backdrop-filter:blur(12px); font-size:12.5px; font-weight:500;"><span style="width:6px; height:6px; border-radius:999px; background:var(--good);"></span>Đủ sáng</span>
        <span style="position:absolute; top:18px; right:18px; padding:4px 10px; border:1px dashed color-mix(in oklab, var(--fg) 45%, transparent); border-radius:999px; font-size:11px;">Ảnh · placeholder</span>
        <p style="position:absolute; left:0; right:0; bottom:20px; text-align:center; font-size:13px; font-weight:400;">Đặt mặt vào khung hình</p>
      </div>

      <div style="display:flex; flex-direction:column; gap:36px; width:300px;">
        <p style="font-size:15px; font-weight:300; line-height:1.6; color:var(--muted); text-wrap:pretty;">Giữ khoảng cách và góc như lần trước</p>
        <div style="display:flex; align-items:center; gap:16px;">
          <span style="display:flex; align-items:center; justify-content:center; width:68px; height:68px; border-radius:999px; border:1.5px solid color-mix(in oklab, var(--fg) 55%, transparent);"><span style="width:54px; height:54px; border-radius:999px; background:var(--accent);"></span></span>
          <span style="font-size:14px; font-weight:400;">Chụp</span>
        </div>
      </div>
    </div>
  </div>
</div>
