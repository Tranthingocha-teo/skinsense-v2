<div style="position:relative; width:390px; height:844px; overflow:hidden; background:var(--bg); color:var(--fg);">
  <div class="night" style="position:absolute; left:0; right:0; top:0; height:320px;"></div>

  <div role="status" style="position:relative; display:flex; flex-direction:column; gap:12px; padding:64px 18px 96px;">
    <div style="display:flex; flex-direction:column; gap:2px; padding:0 4px 18px;">
      <span style="font-size:11.5px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase;">Thứ Hai, 14 tháng 9</span>
      <h1 class="d" style="font-size:54px; line-height:60px;">Hôm nay</h1>
      <span class="muted" style="padding-top:6px; font-size:13px; font-weight:300;">Đang tải…</span>
    </div>
    <!-- Skeleton blocks keep the real card sizes so nothing jumps when data lands -->
    <div style="height:196px; border-radius:18px; background:color-mix(in oklab, var(--fg) 7%, transparent);"></div>
    <div style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px;">
      <div style="height:100px; border-radius:18px; background:color-mix(in oklab, var(--fg) 7%, transparent);"></div>
      <div style="height:100px; border-radius:18px; background:color-mix(in oklab, var(--fg) 7%, transparent);"></div>
    </div>
    <div style="display:flex; flex-direction:column; gap:18px; padding:22px 20px; border-radius:18px; background:color-mix(in oklab, var(--fg) 5%, transparent);">
      <div style="width:56%; height:14px; border-radius:4px; background:color-mix(in oklab, var(--fg) 9%, transparent);"></div>
      <div style="width:80%; height:10px; border-radius:4px; background:color-mix(in oklab, var(--fg) 7%, transparent);"></div>
      <div style="width:68%; height:10px; border-radius:4px; background:color-mix(in oklab, var(--fg) 7%, transparent);"></div>
      <div style="width:74%; height:10px; border-radius:4px; background:color-mix(in oklab, var(--fg) 7%, transparent);"></div>
    </div>
  </div>

  <!--TABS:today-->
</div>
